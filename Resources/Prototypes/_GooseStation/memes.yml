- type: entity
  parent: [BaseStructure, StructureWheeled, BaseMajorContraband]
  id: TruthNuke
  name: truth explosive
  description: "True..."
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: Objects/Devices/nuke.rsi
    noRot: true
    layers:
    - state: nuclearbomb_base
      map: ["enum.NukeVisualLayers.Base"]
    - state: nuclearbomb_deployed_unlit
      map: ["enum.NukeVisualLayers.Unlit"]
      shader: unshaded
      visible: false
    - state: nuke
      sprite: _GooseStation/truth.rsi
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.NukeVisuals.Deployed:
        enum.NukeVisualLayers.Base:
          False: { state: nuclearbomb_base }
          True:  { state: nuclearbomb_deployed }
        enum.NukeVisualLayers.Unlit:
          True:  { visible: true }
          False: { visible: false }
      enum.NukeVisuals.State:
        enum.NukeVisualLayers.Unlit:
          Idle:        { state: nuclearbomb_deployed_unlit }
          Armed:       { state: nuclearbomb_timing }
          YoureFucked: { state: nuclearbomb_exploding }
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 255
        mask:
        - MachineMask
        layer:
        - HalfWallLayer
  - type: PointLight
    enabled: false
    radius: 6
    energy: 2.0
    color: "#FFFFFF"
    mask: /Textures/Effects/LightMasks/double_cone.png
  - type: RotatingLight
    speed: 240
  # - type: NukeLabel #*shrugs in ymlwarrior
  - type: Nuke
    timer: 69
    explosionType: Truth
    maxIntensity: 50
    intensitySlope: 5
    totalIntensity: 50000
    diskSlot:
      name: nuke-slot-component-slot-name-disk
      insertSound:
        path: /Audio/Machines/terminal_insert_disc.ogg
      ejectSound:
        path: /Audio/Machines/terminal_insert_disc.ogg
      whitelist:
        tags:
        - TruthNukeTriggerer #replace with happenings report
    alertLevelOnActivate: delta #check maybe remove
    alertLevelOnDeactivate: green
    alertLevelOnOverride: omicron
  - type: InteractionOutline
  - type: ActivatableUI
    key: enum.NukeUiKey.Key
  - type: UserInterface
    interfaces:
      enum.NukeUiKey.Key:
        type: NukeBoundUserInterface
  - type: StaticPrice
    price: 42069 #just a bit cheaper
  # - type: CargoSellBlacklist #sellable
  # - type: ArrivalsBlacklist #not even necessary
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      Nuke: !type:ContainerSlot
  # - type: SupermatterImmune #because this one matters



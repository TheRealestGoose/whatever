  - !type:BoundaryWallDunGen
    wall: WallReinforcedRust
    cornerWall: WallReinforcedRust
    tile: FloorTechMaintDark

  - !type:JunctionDunGen
    width: 1
    tile: FloorTechMaintDark
    contents: BaseAirlock

  - !type:JunctionDunGen
    width: 3
    tile: FloorTechMaintDark
    contents: BaseAirlock

  - !type:AutoCablingDunGen
    entity: CableApcExtension

  - !type:CornerClutterDunGen
    contents: BaseClutter

  # no decals 4 u


- type: dungeonConfig
  id: AncientComplex
  layers:
  - !type:PrefabDunGen
    roomWhitelist:
      tags:
      - SalvageExperiment #tweak this to have no rooms or make custom rooms for it, also add black lights everywhere and try making windows and doors not spawn broken
    presets:
    - Bucket
    - Wow
    - SpaceShip
    - Tall

  - !type:CorridorDunGen
    width: 3
    tile: FloorTechMaintDark

  - !type:DungeonEntranceDunGen

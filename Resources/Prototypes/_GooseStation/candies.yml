#region Random
- type: entity
  parent: FoodSnackCandyWrappedBase
  id: FoodSnackCandyWrappedMystery
  name: wrapped candy
  description: A candy, still in its wrapper.
  suffix: Mystery
  components:
  - type: Tag
    tags:
    - FoodSnack
  - type: Sprite
    sprite: _GooseStation/candy.rsi
    layers:
    - state: wrapper_middle
      color: "#FFFFFF"
      map: [ "wrapper_middle" ]
    - state: wrapper_outer
      color: "#EDEDED"
  - type: SpawnItemsOnUse
    items:
    - id: FoodSnackCandyMystery
    sound:
      path: /Audio/Effects/unwrap.ogg
  - type: RandomSprite
    getAllGroups: true
    available:
      - wrapper_middle:
          wrapper_middle: Rainbow

- type: entity
  parent: FoodSnackCandyBase
  id: FoodSnackCandyMystery
  name: mystery candy
  description: A mystery flavoured candy. There's no telling what it contains.
  suffix: Mystery
  components:
  - type: Tag
    tags:
    - FoodSnack
  - type: Sprite
    sprite: _GooseStation/candy.rsi
    layers:
    - state: candy
      color: "#FFFFFF"
      map: [ "candy" ]
  - type: RandomFillSolution
    solution: food
    weightedRandomId: RandomFillFoodSnackCandyMystery
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Sugar
          Quantity: 5
  - type: RandomSprite
    available:
      - candy:
          candy: Rainbow

- type: weightedRandomFillSolution
  id: RandomFillFoodSnackCandyMystery
  fills:
  # 5 groups for a total weight of 100
  # Very Good - weight: 15
    - quantity: 5
      weight: 5
      reagents:
      - Stimulants
    - quantity: 5
      weight: 5
      reagents:
      - Ichor
      - Necrosol
    - quantity: 5
      weight: 4
      reagents:
      - Cognizine
    - quantity: 5
      weight: 1
      reagents:
      - Vestine
  # Good - weight: 25
    - quantity: 5
      weight: 25
      reagents:
      - Desoxyephedrine
      - Ephedrine
      - Omnizine
      - Tricordrazine
      - Vitamin
      - PolypyryliumOligomers
      - Charcoal
  # Neutral - weight: 20
    - quantity: 5
      weight: 17.5
      reagents:
      - Ipecac
      - SodiumPolyacrylate
      - SpaceDrugs
      - SpaceGlue
      - Laughter
      - JuiceThatMakesYouWeh
      - Lipozine
      - Carpetium
      - Bananadine
      - THC
      - MindbreakerToxin
      - Mustard
      - HorseradishSauce
    - quantity: 5
      weight: 2.5
      reagents:
      - Honk
  # Bad - weight: 25
    - quantity: 5
      weight: 10.5
      reagents:
      - MuteToxin
      - Pax
      - Fresium
      - Cryptobiolin
    - quantity: 5
      weight: 10.5
      reagents:
      - Uranium
      - Licoxide
      - Razorium
      - Potassium
      - Phlogiston
    - quantity: 5
      weight: 4
      reagents:
      - Toxin
  # Very Bad - weight: 15
    - quantity: 5
      weight: 2.5
      reagents:
      - Nocturine
    - quantity: 5
      weight: 10
      reagents:
      - Bleach
      - CarpoToxin
      - BuzzochloricBees
      - Amatoxin
      - Tazinide
    - quantity: 5
      weight: 2.5
      reagents:
      - Lexorin
      - Lead



#region Base
- type: entity
  parent: FoodBase
  id: FoodSnackCandyWrappedBase
  name: wrapped candy
  description: A candy, still in its wrapper.
  abstract: true
  components:
  - type: Edible
  - type: Tag
    tags:
    - FoodSnack
  - type: Sprite
    sprite: _GooseStation/candy.rsi
    layers:
    - state: wrapper_middle
      color: "#FFFFFF"
    - state: wrapper_outer
      color: "#FFFFFF"
  - type: Item
    sprite: _GooseStation/candy.rsi
    size: Tiny
  - type: SpawnItemsOnUse
    items:
    - id: FoodSnackCandyBase
    sound:
      path: /Audio/Effects/unwrap.ogg

- type: entity
  parent: FoodBase
  id: FoodSnackCandyBase
  abstract: true
  name: candy
  description: A sugar flavoured candy.
  components:
  # - type: FlavorProfile
  #   flavors:
  #   - cherry
  - type: Edible
  - type: Tag
    tags:
    - FoodSnack
  - type: Sprite
    sprite: _GooseStation/candy.rsi
    layers:
    - state: candy
      color: "#FFFFFF"
  - type: Item
    sprite: _GooseStation/candy.rsi
    size: Tiny
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 7
        reagents:
        - ReagentId: Sugar
          Quantity: 5
  - type: Extractable
    grindableSolutionName: food
    juiceSolution:
      reagents:
      - ReagentId: Sugar
        Quantity: 5


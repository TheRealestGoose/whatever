#region Base

- type: entity
  id: RackShelfBase #metal
  parent: BaseStructure
  name: metal rack shelf
  description: A hardware storage rack with shelves.
  abstract: true
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,0.2,0.49,-0.2"
        density: 70
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: Transform
  - type: Appearance
  - type: Damageable
    damageModifierSet: Metallic
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 2
            max: 3
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Physics
    bodyType: Static
  - type: Anchorable
  - type: Pullable
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: InteractionOutline
  - type: ContainerContainer
    containers:
      storagebase: !type:Container

- type: entity
  id: RackShelfPlasticBase #plastic
  parent: RackShelfBase
  name: plastic rack shelf
  description: A hardware storage rack with shelves.
  abstract: true
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,0.2,0.49,-0.2"
        density: 65
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: Damageable
    damageModifierSet: FlimsyMetallic #doesnt exist for plastic
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak #plasticbreak does not exist
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPlastic1:
            min: 2
            max: 3
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  id: RackShelfWoodBase #wood
  parent: RackShelfBase
  name: wood rack shelf
  description: A hardware storage rack with shelves.
  abstract: true
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,0.2,0.49,-0.2"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: Damageable
    damageModifierSet: Wood
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 2
            max: 3
      - !type:DoActsBehavior
        acts: ["Destruction"]

#region Sizes

- type: entity
  id: BaseRackSingle
  description: A hardware storage rack with shelves. Has a single shelf.
  suffix: Single
  abstract: true
  components:
  - type: Storage
    grid:
    - 0,0,9,2 #one shelf
    # - 0,4,9,6
    # - 0,8,9,10
    maxItemSize: Large
  - type: StorageFillVisualizer
    maxFillLevels: 4
    fillBaseName: box-single

- type: entity
  id: BaseRackTwo
  description: A hardware storage rack with shelves. Has two shelves.
  suffix: Two
  abstract: true
  components:
  - type: Storage
    grid:
    - 0,0,9,2 #two shelf
    - 0,4,9,6
    # - 0,8,9,10
    maxItemSize: Large
  - type: StorageFillVisualizer
    maxFillLevels: 5
    fillBaseName: box-two

- type: entity
  id: BaseRackThree
  description: A hardware storage rack with shelves. Has three shelves.
  abstract: true
  components:
  - type: Storage
    grid:
    - 0,0,9,2 #full shelf
    - 0,4,9,6
    - 0,8,9,10
    maxItemSize: Large
  - type: StorageFillVisualizer
    maxFillLevels: 7
    fillBaseName: box


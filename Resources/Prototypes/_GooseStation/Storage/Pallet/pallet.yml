- type: entity
  id: StoragePallet
  parent: BaseStructure
  name: pallet
  description: A masterpiece of industrial engineering, if your definition of engineering is "slapped it together and prayed."
  components:
  - type: Sprite
    drawdepth: SmallMobs
    noRot: true
    sprite: _GooseStation/pallet.rsi
    state: pallet
  - type: Appearance
  - type: Damageable
    damageModifierSet: Wood
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
          params:
            volume: -4
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 1
            max: 3
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Anchorable
  - type: Pullable
  - type: InteractionOutline
  - type: Construction
    graph: Pallet
    node: StoragePallet

- type: entity
  id: StoragePalletCargoBase
  parent: StoragePallet
  name: covered pallet
  description: A cargo pallet covered with tarpaulin. A note on the tarp reads, "Pry with care, or end up with half the share." #breaking yields half
  abstract: true
  components:
  - type: Sprite
    noRot: true
    sprite: _GooseStation/pallet.rsi
    layers:
    - state: pallet
    - state: tarp
      color: "#ffffff"
    - state: ropes
  - type: Physics
    bodyType: Static
    canCollide: true
  - type: Damageable
    damageModifierSet: FlimsyMetallic #cuz plastic
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80 #reinforced by ropes n stuff
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/poster_broken.ogg
          # params:
          #   volume: -4
      - !type:SpawnEntitiesBehavior
        spawn:
          StoragePallet:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 360
        mask:
        - SmallMobMask
        layer:
        - MachineLayer


#region Random
- type: entity
  name: random sheet pallet
  id: StoragePalletCargoSpawnerRandomSheet
  parent: MarkerBase
  suffix: Steel, Plasteel, Plastic, Plasma, Glass, Brass
  components:
    - type: Sprite
      layers:
        - state: red
        - sprite: Objects/Materials/Sheets/metal.rsi
          state: steel_3
    - type: RandomSpawner
      rarePrototypes:
        - StoragePallet
      rareChance: 0.03
      prototypes:
        - StoragePalletCargoSteel
        - StoragePalletCargoPlasteel
        - StoragePalletCargoPlastic
        - StoragePalletCargoPlasma
        - StoragePalletCargoGlass
        - StoragePalletCargoBrass
      chance: 0.97
      offset: 0


- type: construction
  id: TrashBin
  graph: TrashBin
  startNode: start
  targetNode: TrashBin
  category: construction-category-storage
  objectType: Structure
  placementMode: SnapgridCenter
  canBuildInImpassable: false
  conditions:
  - !type:TileNotBlocked

- type: constructionGraph
  id: TrashBin
  start: start
  graph:
  - node: start
    edges:
    - to: TrashBin
      completed:
      - !type:SnapToGrid
        southRotation: true
      steps:
      - material: Steel
        amount: 3
        doAfter: 2
      - material: Cable
        amount: 1
        doAfter: 1

  - node: TrashBin
    entity: TrashBin
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: SheetSteel1
        amount: 2
      - !type:EmptyAllContainers
      - !type:DeleteEntity {}
      steps:
      - tool: Screwing
        doAfter: 2
      - tool: Welding
        doAfter: 3
- type: entity
  parent: CrateGeneric
  id: TrashBin
  name: step bin
  description: One small step for man, a giant leap for station hygene.
  components:
  - type: Icon
    sprite: _GooseStation/trash_bin.rsi
  - type: Sprite
    sprite: _GooseStation/trash_bin.rsi
    offset: 0, 0
    layers:
    - state: base
      map: ["enum.StorageVisualLayers.Base"]
    - state: closed
      map: ["enum.StorageVisualLayers.Door"]
  - type: Rummageable
    table: !type:NestedSelector
      tableId: RatKingLoot
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.45,0.22,0.20"
        density: 75
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Construction
    graph: TrashBin
    node: TrashBin

- type: entity
  parent: TrashBin
  id: TrashBinFilled
  suffix: Filled
  components:
    - type: StorageFill
      contents:
          ## Mobs
        - id: MobCockroach
          prob: 0.05
        - id: MobMothroach
          prob: 0.03
        - id: MobMouse
          prob: 0.05
          ## Packaging
        - id: FoodPacketBoritosTrash

- type: entity
  parent: VendingMachine
  id: VendingMachineVinyldomat
  name: Vinyldomat
  description: An old vendomat born anew. Now featuring only the finest tunes in space.
  components:
  - type: VendingMachine #vendor > uplink?
    pack: VinyldomatInventory
    offState: off
    brokenState: broken
    normalState: normal-unshaded
    ejectState: eject-unshaded
    denyState: deny-unshaded
  - type: AccessReader
    access: [["Service"]]
  - type: DatasetVocalizer
    dataset: VendomatAds #!!!
  - type: SpeakOnUIClosed
    pack: GenericVendGoodbyes
  - type: Sprite
    noRot: true
    sprite: _GooseStation/vinyldomat.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: PointLight
    radius: 2
    energy: 1.6
    color: "#9dc5c9"
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
  - type: Transform
    noRot: false
  - type: Rotatable
    rotateWhileAnchored: false
    rotateWhilePulling: true

- type: entity
  id: VinylPlayerPhonograph #Open
  name: phonograph
  parent: BaseItem
  description: An old school vinyl record player sat on a set of drawers.
  components:
  # - type: Storage
  #   whitelist:
  #     components:
  #     - ItemSlots
  #   grid:
  #   - 0,0,6,1
  # - type: UserInterface
  #   interfaces:
  #     enum.StorageUiKey.Key:
  #       type: StorageBoundUserInterface
  # - type: DisassembleOnAltVerb
  #   prototypeToSpawn: PhonographClosed
  #   disassembleTime: 1
  # - type: Icon #figure this part out: inhands icon should be closed, if you can.
  #   sprite: _GooseStation/phonograph.rsi
  #   state: closed
  - type: Item
    sprite: _GooseStation/phonograph.rsi
    state: closed
    size: Large
  - type: Sprite
    sprite: _GooseStation/phonograph.rsi
    state: open
    snapCardinals: true
    granularLayersRendering: true #?
    drawdepth: SmallObjects
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.3,0.3,0.3"
        density: 500
        mask:
        - TabletopMachineMask
        layer:
        - BulletImpassable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Appearance
  - type: VinylPlayer
  - type: ContainerContainer
    containers:
      # storagebase: !type:Container
      vinyl: !type:ContainerSlot
  - type: ItemSlots
    slots:
      vinyl:
        name: vinyl
        whitelist:
          components:
          - Vinyl
  - type: ItemMapper
    containerWhitelist: [vinyl]
    mapLayers:
      disk_installed:
        whitelist:
          components:
          - Vinyl


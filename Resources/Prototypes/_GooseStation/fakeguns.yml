#region funny turret

- type: entity
  id: PelletShotgunSpreadCapsThree
  categories: [ HideSpawnMenu ]
  parent: PelletShotgunCaps
  components:
  - type: ProjectileSpread
    proto: PelletShotgunCaps
    count: 3
    spread: 10

- type: entity
  parent: BaseWeaponBallisticTurret
  id: WeaponTurretFunny
  description: A ballistic machine gun auto-turret. Spreads joy and sillyness, can be repaired by a wrench.
  suffix: Theatre
  components:
  - type: Repairable
    qualityNeeded: "Anchoring"
    doAfterDelay: 3
  - type: Gun
    fireRate: 1
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot: /Audio/Weapons/Guns/Gunshots/gun_sentry.ogg
  - type: BallisticAmmoProvider
    proto: PelletShotgunSpreadCapsThree
    capacity: 69
  - type: NpcFactionMember
    factions:
    - AllHostile
  - type: TurretTargetSettings
    exemptAccessLevels:
    - Theatre
  - type: TriggerOnEmptyGunshot
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:TriggerBehavior
  - type: SpawnOnTrigger
    proto: PuddleSpaceLube

- type: entity
  name: funny electrical toolbox
  suffix: Theatre, Turret
  parent: ToolboxElectrical
  id: ToolboxElectricalTurretTheatre
  description: A toolbox typically stocked with electrical gear. It beckons you to hit it with a tool in a funny location.
  components:
  - type: StorageFill
    contents:
    - id: Wrench
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,0,1
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 100
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
      - trigger:
          !type:DamageTrigger
          damage: 1
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:SpawnEntitiesBehavior
            spawn:
              WeaponTurretFunny:
                min: 1
                max: 1
  - type: StaticPrice
    price: 69




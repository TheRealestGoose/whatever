- type: entity
  parent: [ ClothingOuterEVASuitBase, ClothingOuterBaseToggleable, BaseSyndicateContraband ]
  id: ClothingOuterSuitFakeBase
  abstract: true
  components:
  - type: ScannableForPoints
    points: 0
  - type: Sprite
    sprite: Clothing/OuterClothing/Suits/eva_emergency.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Suits/eva_emergency.rsi
  - type: ClothingSpeedModifier #Cloth replica so no slowdown?
    walkModifier: 1
    sprintModifier: 1
  - type: HeldSpeedModifier
  - type: PressureProtection
    highPressureMultiplier: 0.6
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.2
    coolingCoefficient: 0.2
  - type: Tag
    tags:
    - SuitEVA
    - Softsuit
  - type: ToggleableClothing
    clothingPrototypes:
      head: ClothingHeadHelmetFake

- type: entity
  parent: [ClothingHeadEVAHelmetBase, BaseSyndicateContraband]
  id: ClothingHeadHelmetFake
  abstract: true
  components:
  - type: ScannableForPoints
    points: 0
  - type: Sprite
    sprite: Clothing/Head/Helmets/eva_large.rsi
  - type: Clothing
    sprite: Clothing/Head/Helmets/eva_large.rsi
  - type: Tag
    tags:
    - HelmetEVA

- type: entity
  id: ClothingCellLightBase
  abstract: true
  components:
  - type: Sprite
    layers:
    - state: icon
    - state: icon-flash
      visible: false
      map: [ "light" ]
  - type: Clothing
    equippedPrefix: off
  - type: ToggleableVisuals
    spriteLayer: light
  - type: ItemTogglePointLight
  - type: PointLight
    enabled: false
    radius: 3
    energy: 2
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    netsync: false
  - type: Appearance
  - type: HandheldLight
    addPrefix: true
    blinkingBehaviourId: blinking
    radiatingBehaviourId: radiating
  - type: LightBehaviour
    behaviours:
      - !type:FadeBehaviour
        id: radiating
        interpolate: Linear
        maxDuration: 2.0
        startValue: 3.0
        endValue: 2.0
        isLooped: true
        reverseWhenFinished: true
      - !type:PulseBehaviour
        id: blinking
        interpolate: Nearest
        maxDuration: 1.0
        startValue: 0.1
        endValue: 2.0
        isLooped: true
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHigh
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot


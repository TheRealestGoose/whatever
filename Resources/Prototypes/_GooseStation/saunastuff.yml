# coal pit
- type: entity
  name: water vapor gas miner sauna
  parent: GasMinerBase
  id: GasMinerWaterVaporSauna
  components:
    - type: GasMiner
      spawnTemperature: 350
      # maxExternalAmount: 100
      maxExternalPressure: 250 #120.3
      spawnAmount: 100000
      spawnGas: WaterVapor


# Drink board
- type: entity
  name: drinks dartboard
  id: TargetDartsDrinks
  parent: BaseStructureDynamic
  description: Can't choose what to drink? This helpful dartboard is here for you.
  components:
  - type: Sprite
    sprite: Objects/Fun/Darts/target.rsi
    state: target_dart
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 50
        mask:
        - FullTileMask
        layer:
        - WallLayer

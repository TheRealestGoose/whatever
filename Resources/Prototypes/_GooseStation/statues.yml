#region Base
- type: entity
  id: ScrapStatueBase
  parent: BaseStructure
  name: scrap effigy
  description: A towering, jagged silhouette fashioned from industrial debris and discarded machine parts, forming an unsettling mimicry of a humanoid figure.
  abstract: true
  components:
  - type: Sprite
    noRot: true
    sprite: _GooseStation/scrap-statues.rsi
    state: scrap_bananium_clown
    drawdepth: Mobs
    offset: "0.0,0.3"
  - type: Clickable
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50 #(50*4=200)
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  id: ScrapStatueInfested
  parent: ScrapStatueBase
  name: scrap effigy
  description: A towering, jagged silhouette fashioned from industrial debris and discarded machine parts, forming an unsettling mimicry of a humanoid figure.
  abstract: true
  components:
  - type: Sprite
    noRot: true
    sprite: _GooseStation/scrap-statues.rsi
    layers:
      - state: scrap_bananium_clown
      - state: scrap_bananium_clown_anim1
        map: [ "anim-1" ]
        shader: unshaded
      - state: scrap_bananium_clown_anim2
        map: [ "anim-2" ]
        shader: unshaded
      - state: scrap_bananium_clown_anim3
        map: [ "anim-3" ]
        shader: unshaded
      - state: scrap_bananium_clown_anim4
        map: [ "anim-4" ]
        shader: unshaded
    drawdepth: Mobs
    offset: "0.0,0.3"
  - type: RandomSprite
    available:
      - anim-1:
          gone: ""
          scrap_bananium_clown_anim1: ""
      - anim-2:
          gone: ""
          scrap_bananium_clown_anim2: ""
      - anim-3:
          gone: ""
          scrap_bananium_clown_anim3: ""
      - anim-4:
          gone: ""
          scrap_bananium_clown_anim4: ""
  - type: Clickable
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50 #(50*4=200)
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Timer
  - type: TimedSpawner
    prototypes:
      - SpawnMobMouse
      - MobCockroach
      # MobLootbug
      # MobAdultSlimesYellowAngry
      # MobAdultSlimesBlueAngry
      # MobAdultSlimesGreenAngry
    # round ~90m
    # one spawner should only spawn ~5 mice for sanity reasons
    # therefore 18m
    # use 50% chance for randomness and balance with halved interval
    chance: 0.5
    intervalSeconds: 540
    minimumEntitiesSpawned: 1
    maximumEntitiesSpawned: 1

#region Mobs

- type: entity
  id: MobScrapGolemBase
  parent: [ BaseMob, MobCombat ]
  abstract: true
  components:
  - type: MovementSpeedModifier
    baseWalkSpeed: 2
    baseSprintSpeed: 2
  - type: MobState
  - type: MobThresholds
    thresholds:
      0: Alive
      50: Dead
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: StructuralMetallicStrong
  - type: MeleeWeapon
    altDisarm: false
    animation: WeaponArcClaw
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    damage:
      types:
        Slash: 15
  - type: Pullable
  - type: InputMover
  - type: MobMover
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      # NavClimb: !type:Bool
      #   true
      NavSmash: !type:Bool
        true
      # NavInteract: !type:Bool
      #   true
      # NavPry: !type:Bool
      #   true
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: Tag
    tags:
    - DoorBumpOpener
    - FootstepSound
  - type: FootstepModifier
    footstepSoundCollection:
      collection: MetalScrape
      params:
        volume: -3
        maxDistance: 10
        variation: 0.01
        pitch: 1.25
  # - type: Prying
  #   pryPowered: false
  - type: ComplexInteraction
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 50
        behaviors:
          - !type:SpawnEntitiesBehavior
            offset: 0
            spawn:
              ScrapMetalPile:
                min: 1
                max: 1
          - !type:PlaySoundBehavior
            sound:
              collection: MetalBreak
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
  - type: PassiveDamage #slowly die
    allowedStates:
     - Alive
    damage:
      types:
        Blunt: 1.25
  - type: AmbientSound
    volume: 10
    range: 10
    enabled: true
    sound:
      path: /Audio/_Goobstation/Wraith/Mobs/brullbar/brullbar_scream.ogg
      params:
        volume: 2
        maxDistance: 10
        pitch: 0.4
        variation: 0.05
  # - type: SpamEmitSound
  #   minInterval: 5
  #   maxInterval: 25
  #   sound:
  #     collection: MetalScrape
  #     params:
  #       volume: -1
  #       maxDistance: 12
  #       variation: 0.01

- type: entity
  name: crawling scrap amalgam
  id: MobScrapGolemCrawler
  parent: MobScrapGolemBase
  description: A grotesque amalgamation of fused scrap held together by a precarious tension that suggests it might fall to pieces any moment. It drags itself across the floor on an assembly of rusted pipes and serrated metal.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _GooseStation/scrap-golems.rsi
    layers:
      - state: crawler
        map: [ "movement" ]
  - type: SpriteMovement
    movementLayers:
      movement:
        state: crawler-moving
    noMovementLayers:
      movement:
        state: crawler
  - type: MeleeWeapon
    altDisarm: false
    animation: WeaponArcClaw
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    damage:
      types:
        Slash: 15
  - type: HTN
    rootTask:
      task: SimpleHostileCompound

- type: entity
  id: MobScrapGolemMonstrosity
  parent: MobScrapGolemBase
  name: limping scrap amalgam
  description: A grotesque amalgamation of fused scrap held together by a precarious tension that suggests it might fall to pieces any moment. It's central mass has been hoisted atop eight uneven appendages fashioned from discarded conduits and sharpened rebar. Attached to it is a single jagged limb, crudely sharpened into a sickeningly rigid blade.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _GooseStation/scrap-golems.rsi
    layers:
      - state: monstrosity
        map: [ "movement" ]
  - type: SpriteMovement
    movementLayers:
      movement:
        state: monstrosity-moving
    noMovementLayers:
      movement:
        state: monstrosity
  - type: MeleeWeapon
    altDisarm: false
    animation: WeaponArcThrust
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    damage:
      types:
        Slash: 15
  - type: HTN
    rootTask:
      task: SimpleHostileCompound

- type: entity
  name: random scrap amalgam spawner
  id: SpawnerMobScrapGolemRandom
  parent: MarkerBase
  components:
    - type: Sprite
      layers:
        - state: red
        - sprite: _GooseStation/scrap-golems.rsi
          state: monstrosity-moving
    - type: RandomSpawner
      prototypes:
        - MobScrapGolemCrawler
        - MobScrapGolemMonstrosity
      chance: 1
      offset: 0


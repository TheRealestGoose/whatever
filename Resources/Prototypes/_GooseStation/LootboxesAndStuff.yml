- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckGlowingCloak
  name: glowing cloak
  description: A cool glowing cloak. Color configurable with a multitool!
  components:
  - type: Sprite
    sprite: _GooseStation/glowingcloak.rsi
    layers:
      - state: icon
      - state: icon-unshaded
        color: "#FFFFFF"
        visible: false
        shader: unshaded
        map: [ "blade" ]
  - type: EnergySword
  - type: ItemToggle
    # Goobstation start
    soundFailToActivate:
      path: /Audio/Machines/button.ogg
      params:
        variation: 0.250
    # Goobstation end
    soundActivate:
      path: /Audio/Items/pen_click.ogg
    soundDeactivate:
      path: /Audio/Items/pen_click.ogg
  # - type: ItemToggleActiveSound #obnoxious
  #   activeSound:
  #     path: /Audio/Weapons/ebladehum.ogg
  # - type: ItemTogglePointLight #better without it
  #   toggleableVisualsColorModulatesLights: true
  - type: UseDelay
    delay: 1.0
  # - type: PointLight #better without it
  #   enabled: false
  #   radius: 1.2
  #   energy: 1
  #   color: white
  #   netsync: false
  - type: Appearance
  - type: ToggleableVisuals # Add support for multiple layers
    spriteLayer: blade
    clothingVisuals:
      neck:
        - state: equipped-NECK-unshaded
          shader: unshaded
    inhandVisuals:
      left:
      - state: inhand-left-unshaded
        shader: unshaded
      right:
      - state: inhand-right-unshaded
        shader: unshaded
  - type: UserInterface # Goobstation-EsColorPicker
    interfaces:
      enum.EsColorPickerMenu.Key:
        type: EsColorPickerBUI


- type: entity
  parent: ClothingHandsBase
  id: ClothingHandsHoloGloves
  name: holographic gloves
  description: "These gloves can insulate against electricity and pry open unpowered airlocks. Features multitool-configurable glowing elements that deploy as holographic claws or a self-powering disabler when switched on."
  components:
  - type: Sprite
    sprite:  _GooseStation/holo-gloves.rsi
    layers:
      - state: icon
      - state: icon-unshaded
        color: "#FFFFFF"
        visible: false
        shader: unshaded
        map: [ "blade" ]
  - type: Appearance
  - type: ItemToggle
    soundFailToActivate:
      path: /Audio/Machines/button.ogg
      params:
        variation: 0.250
    soundActivate:
      path: /Audio/Items/pen_click.ogg
    soundDeactivate:
      path: /Audio/Items/pen_click.ogg
  - type: EnergySword
  - type: UseDelay
    delay: 1.0
  - type: Clothing
    sprite:  _GooseStation/holo-gloves.rsi
    clothingVisuals:
      gloves:
      - state: equipped-HAND
  - type: ToggleableVisuals
    spriteLayer: blade
    clothingVisuals:
      gloves:
        - state: equipped-HAND-unshaded #-alt
          shader: unshaded
  - type: UserInterface
    interfaces:
      enum.EsColorPickerMenu.Key:
        type: EsColorPickerBUI
  - type: ClothingGrantComponent
    component:
    - type: Prying #allows prying unpowered unbolted doors
      pryPowered: false
      force: false
      speedModifier: 1.5
      instaPry: true #wanted false but sounds weird so no
  - type: Insulated #just free insuls, 10k + gamba is worth it
  - type: BatteryDrinkerSource # Goobstation - Energycrit
    maxAmount: 100
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 10
  - type: Battery
    maxCharge: 500
    startingCharge: 500
  - type: ExaminableBattery
  - type: ComponentToggler
    removeComponents:
      - type: ItemSwitch
        showLabel: true
        state: claws
        states:
          claws: !type:ItemSwitchState
            verb: claws
            sprite:
              sprite: _GooseStation/holo-gloves.rsi
              state: icon
            components:
              - type: MeleeWeapon
                animationRotation: -45 # WWDP      # from esword, kept just in case
                heavyStaminaCost: 2.5 # goob edit  # doesnt actually do anything
                wideAnimationRotation: -135        # cuz i turned wideswing off
                mustBeEquippedToUse: true #IMPORTANT BRUH
                canWideSwing: false
                attackRate: 1.2
                soundHit:
                  path: /Audio/Weapons/bladeslice.ogg
                damage:
                  types:
                    Slash: 7
                    Heat: 5
                    Structural: 30 #30 is just enough for rocks #doesnt have to
                woundSeverityMultipliers: # Goobstation
                  Slash: 1.5
                  Heat: 1.5
            soundStateActivate:
              collection: sparks
              params:
                variation: 0.125
          disabler: !type:ItemSwitchState
            verb: disabler
            sprite:
              sprite: _GooseStation/holo-gloves.rsi
              state: icon
            components:
              # - type: AmmoCounter #so doesnt pam red squares
              - type: GunExecutionBlacklist # Goobstation
              - type: PacifismAllowedGun
              - type: Gun
                fireRate: 2
                selectedMode: SemiAuto
                clumsyProof: true
                availableModes:
                - SemiAuto
                soundGunshot:
                  path: /Audio/Weapons/Guns/Gunshots/taser2.ogg
              - type: ProjectileBatteryAmmoProvider
                proto: BulletDisabler
                fireCost: 100 #more than disabler cuz smaller
            soundStateActivate:
              collection: sparks
              params:
                variation: 0.125
      - type: MeleeWeapon
        animationRotation: -45 # WWDP      # from esword, kept just in case
        heavyStaminaCost: 2.5 # goob edit  # doesnt actually do anything
        wideAnimationRotation: -135        # cuz i turned wideswing off
        mustBeEquippedToUse: true #IMPORTANT BRUH
        canWideSwing: false
        attackRate: 1.2
        soundHit:
          path: /Audio/Weapons/bladeslice.ogg
        damage:
          types:
            Slash: 7
            Heat: 5
            Structural: 30 #30 is just enough for rocks #doesnt have to
        woundSeverityMultipliers: # Goobstation
          Slash: 1.5
          Heat: 1.5
      # - type: AmmoCounter
      - type: GunExecutionBlacklist # Goobstation
      - type: PacifismAllowedGun
      - type: Gun
        fireRate: 2
        selectedMode: SemiAuto
        clumsyProof: true
        availableModes:
        - SemiAuto
        soundGunshot:
          path: /Audio/Weapons/Guns/Gunshots/taser2.ogg
      - type: ProjectileBatteryAmmoProvider
        proto: BulletDisabler
        fireCost: 100 #more than disabler, because small
    components:
      - type: ItemSwitch
        showLabel: true
        state: claws
        states:
          claws: !type:ItemSwitchState
            verb: claws
            sprite:
              sprite: _GooseStation/holo-gloves.rsi
              state: icon
            components:
              - type: MeleeWeapon
                animationRotation: -45 # WWDP      # from esword, kept just in case
                heavyStaminaCost: 2.5 # goob edit  # doesnt actually do anything
                wideAnimationRotation: -135        # cuz i turned wideswing off
                mustBeEquippedToUse: true #IMPORTANT BRUH
                canWideSwing: false
                attackRate: 1.2
                soundHit:
                  path: /Audio/Weapons/bladeslice.ogg
                damage:
                  types:
                    Slash: 7
                    Heat: 5
                    Structural: 30 #30 is just enough for rocks #doesnt have to
                woundSeverityMultipliers: # Goobstation
                  Slash: 1.5
                  Heat: 1.5
            soundStateActivate:
              collection: sparks
              params:
                variation: 0.125

          disabler: !type:ItemSwitchState
            verb: disabler
            sprite:
              sprite: _GooseStation/holo-gloves.rsi
              state: icon
            components:
              # - type: AmmoCounter #so doesnt pam red squares
              - type: GunExecutionBlacklist # Goobstation
              - type: PacifismAllowedGun
              - type: Gun
                fireRate: 2
                selectedMode: SemiAuto
                clumsyProof: true
                availableModes:
                - SemiAuto
                soundGunshot:
                  path: /Audio/Weapons/Guns/Gunshots/taser2.ogg
              - type: ProjectileBatteryAmmoProvider
                proto: BulletDisabler
                fireCost: 100 #more than disabler cuz smaller
            soundStateActivate:
              collection: sparks
              params:
                variation: 0.125
  - type: Tag
    tags:
    - WhitelistChameleon


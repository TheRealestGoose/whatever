- type: entity
  parent: ClothingShoesBase
  id: ClothingShoesRocketBoots
  name: rocket boots
  description: Rocket-propelled boots with rollers hidden in the sole as well as built in illumination (Color configurable with a multitool!). Extreme caution is adviced when using these!
  components:
  - type: Sprite
    sprite: _GooseStation/rocket-boots.rsi
    layers:
      - state: icon
      - state: icon-unshaded
        color: "#FFFFFF"
        visible: false
        shader: unshaded
        map: [ "blade" ]
  - type: Clothing
    sprite: _GooseStation/rocket-boots.rsi
    clothingVisuals:
      shoes:
      - state: equipped-FEET
        visible: true
      - state: equipped-FEET-unshaded
        color: "#FFFFFF"
        visible: false
        shader: unshaded
        map: [ "blade" ]
  - type: ItemToggle
    soundFailToActivate:
      path: /Audio/Machines/button.ogg
      params:
        variation: 0.250
    soundActivate:
      path: /Audio/Items/pen_click.ogg
    soundDeactivate:
      path: /Audio/Items/pen_click.ogg
  - type: Skates
    friction: 0.075
    frictionNoInput: 0.075
    speedDamage: 1.5 #just a bit more than normal skates
    stunSeconds: 2 #less than normal skates
    minimumSpeed: 8
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepSkates
      params:
        variation: 0.08
  - type: JumpAbility
    jumpDistance: 1
    jumpThrowSpeed: 20
    jumpSound: /Audio/Effects/extinguish.ogg
  - type: ActionGrant
    actions:
    - ActionGravityJump
  - type: ItemActionGrant
    actions:
    - ActionGravityJump
    activeIfWorn: true
    restrictedSlots:
    - FEET
  - type: Appearance
  - type: ClothingSpeedModifier #they are heavy..
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: StaticPrice
    price: 750
  - type: EnergySword
  - type: UseDelay
    delay: 1.0
  - type: ToggleableVisuals
    spriteLayer: blade
    clothingVisuals:
      shoes:
        - state: equipped-FEET-unshaded
          shader: unshaded
    inhandVisuals:
      left:
      - state: inhand-left-unshaded
        shader: unshaded
      right:
      - state: inhand-right-unshaded
        shader: unshaded
  - type: UserInterface
    interfaces:
      enum.EsColorPickerMenu.Key:
        type: EsColorPickerBUI


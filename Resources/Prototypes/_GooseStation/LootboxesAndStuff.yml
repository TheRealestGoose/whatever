- type: entity
  id: GooseUplinkWallmount
  parent: StorePresetGooseShop
  name: Store Interface
  description: Gives you access to a store page for buying things. Powered by the corporate greed.
  suffix: directional
  placement:
    mode: SnapgridCenter
    snap:
    - Wallmount
  components:
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Fixtures
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    canCollide: false
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: Structures/Machines/computers.rsi
    layers:
      - map: ["computerLayerBody"]
        state: telescreen_frame
      - map: ["computerLayerScreen"]
        shader: unshaded
        state: telescreen
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
  - type: ActivatableUI
    key: enum.StoreUiKey.Key
  - type: Store
    balance:
      SpaceCash: 0
  - type: WallMount
    arc: 175


- type: entity
  id: SpawnPodLootbox
  name: Drop Lootbox
  parent: SpawnSupplyEmpty
  components:
  - type: SpawnOnDespawn
    prototype: Lootbox

- type: entity
  id: Lootbox
  name: lootbox
  description: A lootbox that contains a randomised set of items! Guaranteed to have one toy, one clothing item and one utility item!
  parent: [PresentBase, BaseItem]
  suffix: Random
  components:
  - type: Sprite
    sprite: _GooseStation/lootbox.rsi
    layers:
      - state: loot
  - type: SpawnItemsOnUse
    sound:
      path: /Audio/Items/toolbox_open.ogg
    items:
    # toys
      - id: PlushieGoose
        orGroup: GiftToys
      - id: PlushieSpaniard
        orGroup: GiftToys
      - id: ToyFigurineAltQuartermaster
        orGroup: GiftToys
      - id: ToyFigurineAltSalvage
        orGroup: GiftToys
    # clothing
      - id: ClothingMaskBigBossClown
        orGroup: GiftClothing
      - id: ClothingNeckLiveleakMeme
        orGroup: GiftClothing
      - id: ClothingNeckIfunnyMeme
        orGroup: GiftClothing
      - id: ClothingNeckGlowingCloak #my magnum opus
        orGroup: GiftClothing
      - id: ClothingNeckGlowingArmbands
        orGroup: GiftClothing
      - id: ClothingShoesRocketBoots #my second magnum opus
        orGroup: GiftClothing
      - id: ClothingMaskTacticalNeckGaiter #my third magnum opus
        orGroup: GiftClothing
      - id: ClothingHandsHoloGloves #my fourth magnum opus
        orGroup: GiftClothing
    # utility
      - id: BeartrapBoxGoose
        orGroup: GiftUtil
      - id: FoodBoxNugget
        orGroup: GiftUtil
      # - id: DrinkJarWhat
      #   orGroup: GiftUtil
    # extra
      - id: BoxFolderSpacesteinFiles
        onGroup: GiftExtra
        prob: 0.1



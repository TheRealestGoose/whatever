- type: storeCategory
  id: GooseStationStore
  name: "Le stuff!1!"
  priority: 0

- type: currency
  id: SpaceCash
  displayName: spesos
  cash:
    1: SpaceCash
  canWithdraw: true

- type: entity
  id: StorePresetGooseShop
  abstract: true
  components:
  - type: Store
    name: "Le Epic Store!11!"
    categories:
    - GooseStationStore
    currencyWhitelist:
    - SpaceCash
    balance:
      SpaceCash: 0
    # sales: # WD EDIT
    #   enabled: true
    #   minMultiplier: 0.2
    #   maxMultiplier: 0.8
    #   minItems: 4

#region Construction

- type: construction
  id: PosterLegit
  graph: Poster
  startNode: start
  targetNode: Legit
  category: construction-category-misc
  placementMode: SnapgridCenter
  canBuildInImpassable: true
  name: unroll corporate poster
  description: You are not immune to propaganda

- type: construction
  id: PosterContraband
  graph: Poster
  startNode: start
  targetNode: Contraband
  category: construction-category-misc
  placementMode: SnapgridCenter
  canBuildInImpassable: true
  name: unroll questionable poster
  description: You are not immune to propaganda

- type: constructionGraph
  id: Poster
  start: start
  graph:
    - node: start
      edges:
        - to: Legit
          steps:
            - tag: PosterLegal
              name: rolled up corporate poster
              icon:
                sprite: Structures/Wallmounts/posters.rsi
                state: rolled_legit
              doAfter: 2
        - to: Contraband
          steps:
            - tag: PosterContra
              name: rolled up questionable poster
              icon:
                sprite: Structures/Wallmounts/posters.rsi
                state: rolled_contraband
              doAfter: 2

    - node: Legit
      entity: RandomPosterLegitGS

    - node: Contraband
      entity: RandomPosterContrabandGS



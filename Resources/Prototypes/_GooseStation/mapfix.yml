- type: entity
  name: sofa
  id: MapfixBenchSofaMiddle
  parent: BenchBaseMiddle
  suffix: Mapfix
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _SimpleStation/Structures/Furniture/Benches/sofa.rsi

- type: entity
  id: MapfixBenchSofaLeft
  parent: MapfixBenchSofaMiddle
  suffix: Left, Mapfix
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    state: left

- type: entity
  id: MapfixBenchSofaRight
  parent: MapfixBenchSofaMiddle
  suffix: Right, Mapfix
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    state: right

- type: entity
  name: sofa
  id: MapfixBenchSofaCorner
  description: Multiple seats spanning a single object. Truly a marvel of science.
  suffix: Corner, Mapfix
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Rotatable
  - type: Sprite
    sprite: _SimpleStation/Structures/Furniture/Benches/sofa.rsi
    state: corner
  - type: Clickable
  - type: InteractionOutline
  - type: Pullable
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak


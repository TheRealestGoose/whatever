#region Yarnball

- type: entity
  parent: BaseItem
  id: YarnballBase
  name: yarnball
  description: A tangled mess of wool that promises hours of feline entertainment.
  suffix: White
  components:
  - type: Sprite
    sprite: _GooseStation/SS13-GOON/yarn_and_wool.rsi
    state: yarn-ball-white-rolling
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.2
          # position: "0,-0.2"
        density: 20
        mask:
        - ItemMask
        restitution: 0.5 # not bouncy
        friction: 0.6
  - type: Catchable
    catchChance: 0.8
    catchSuccessSound:
      path: /Audio/Effects/Footsteps/bounce.ogg
  - type: EmitSoundOnCollide
    sound:
      path: /Audio/Effects/Footsteps/bounce.ogg
  - type: Item
    size: Tiny
    sprite: _GooseStation/SS13-GOON/yarn_and_wool.rsi
    # storedSprite: #did not work, stored sprite cannot be colored
    #   sprite: _GooseStation/SS13-GOON/yarn_and_wool.rsi
    #   state: yarn-ball-white
    #   scale: "1.5,1.5"
    # storedOffset: "0,-4"
  # - type: Trail
  #   lifetime: 1
  #   lerpTime: 0.1
  #   frequency: 0.1
  #   alphaLerpAmount: 0.5
  #   renderedEntityRotationStrategy: Particle
  #   scale: 0.05
  - type: TileFrictionModifier
    modifier: 0.1
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/poster_broken.ogg
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialCloth1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  parent: YarnballBase
  id: YarnballBaseTrail
  suffix: "Trail"
  components:
  - type: Sprite
    sprite: _GooseStation/SS13-GOON/yarn_and_wool.rsi
    state: yarn-ball-white-rolling
  - type: Item
    size: Tiny
    sprite: _GooseStation/SS13-GOON/yarn_and_wool.rsi
    storedSprite:
      sprite: _GooseStation/SS13-GOON/yarn_and_wool.rsi
      state: yarn-ball-white
      scale: "1.5,1.5"
    storedOffset: "0,-4"
  - type: Trail
    lifetime: 1
    lerpTime: 0.1
    frequency: 0.1
    alphaLerpAmount: 0.5
    renderedEntityRotationStrategy: Particle
    scale: 0.05



- type: entity
  parent: BaseItem
  id: LicenseBase
  name: license
  description: "Despite being considered a form of ID card, does not actually allow you to open locked airlocks.\n\nThis credential is perfectly formatted for a desk drawer, mostly because nobody really checks these anyways."
  abstract: true
  components:
  - type: Sprite
    sprite: _GooseStation/license.rsi
    state: card
  # - type: Item
  #   size: Tiny
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/card_pickup.ogg
      params:
        volume: -5
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Goobstation/Items/handling/card_drop.ogg
      params:
        volume: -5
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Goobstation/Items/handling/card_drop.ogg
      params:
        volume: -5
  - type: PhysicalComposition
    materialComposition:
      Plastic: 50
  # - type: IdCard
  #   canMicrowave: false
  # - type: PresetIdCard
  #   jobName: "license"
  # - type: Access
  #   enabled: false
  # - type: StationRecordKeyStorage


- type: dungeonConfig
  id: VGRoidAsteroidCaves
  layers:
    - !type:PrototypeDunGen
      proto: VGRoidBlobSmall
    - !type:PrototypeDunGen
      proto: VGRoidExteriorSmall
    - !type:PrototypeDunGen
      proto: VGRoidBelt
    - !type:PrototypeDunGen
      proto: VGRoidCaveSystem
    - !type:PrototypeDunGen
      proto: VGRoidFillDummyForCrystals
      inheritDungeons: All
    - !type:OreDunGen
      replacement: AsteroidRockMining
      entity: RandomCrystal
      count: 1
      minGroupSize: 1000
      maxGroupSize: 1000
    # - !type:PrototypeDunGen #paths not needed if only 1 dungeon
    #   proto: VGRoidSmallPaths
    #   inheritDungeons: All
    # - !type:EntityTableDunGen #replaced with cave system
    #   minCount: 8
    #   maxCount: 12
    #   table:
    #     id: VGRoidAsteroidBeltCacheRoomMarker
    # Fill
    - !type:PrototypeDunGen
      proto: VGRoidFillAsteroidRock
      inheritDungeons: All
    # fix interiors

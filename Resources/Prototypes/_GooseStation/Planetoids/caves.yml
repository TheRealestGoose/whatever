      maxGroupSize: 1
    - !type:OreDunGen
      replacement: AsteroidRockUranium
      entity: AsteroidRockUraniumCrab
      count: 4
      minGroupSize: 1
      maxGroupSize: 1
    - !type:OreDunGen
      replacement: AsteroidRockBananium
      entity: AsteroidRockBananiumCrab
      count: 1
      minGroupSize: 1
      maxGroupSize: 1

# Configs
# Fill with rocks.
- type: dungeonConfig
  id: VGRoidFillAsteroidRock
  layers:
  - !type:FillGridDunGen
    entity: AsteroidRock
    allowedTiles:
    - FloorAsteroidSand

- type: dungeonConfig
  id: VGRoidFillDummyForCrystals
  layers:
  - !type:FillGridDunGen
    entity: AsteroidRockMining
    allowedTiles:
    - FloorAsteroidSandBorderless

- type: entity
  id: RandomCrystal
  parent: MarkerBase
  name: random crystal
  suffix: "0.01%"
  components:
  - type: Sprite
    layers:
      - state: red
      - sprite: Structures/Decoration/crystal.rsi
        state: crystal_grey
  - type: RandomSpawner
    chance: 0.01
    prototypes:
      - CrystalGreen
      - CrystalPink
      - CrystalOrange
      - CrystalBlack
      - CrystalBlue
      - CrystalYellow
      - CrystalCyan
    offset: 0.0

- type: dungeonConfig
  id: VGRoidBlobSmall
  layers:
  - !type:NoiseDistanceDunGen
    size: 125, 125 #169, 169
    distanceConfig: !type:DunGenEuclideanSquaredDistance
      blendWeight: 0.80
    layers:
    - tile: FloorAsteroidSand
      threshold: 0.50
      noise:
        frequency: 0.010
        noiseType: OpenSimplex2
        fractalType: FBm
        octaves: 5
        lacunarity: 2
        gain: 0.5

- type: dungeonConfig
  id: VGRoidCaveSystem
  # minOffset: 40
  # maxOffset: 60
  layers:
  - !type:NoiseDistanceDunGen
    size: 110, 110
    distanceConfig: !type:DunGenEuclideanSquaredDistance
    layers:
    - tile: FloorAsteroidSandBorderless
      threshold: 0.7
      invert: true
      noise:
        seed: 0
        noiseType: Perlin
        fractalType: Ridged
        octaves: 1
        frequency: 0.05
        gain: 0.5


      replacement: AsteroidRock
      entity: AsteroidRockCoal
      count: 12
      minGroupSize: 4
      maxGroupSize: 8
    - !type:OreDunGen
      replacement: AsteroidRock
      entity: AsteroidRockQuartz
      count: 12
      minGroupSize: 6
      maxGroupSize: 11
    - !type:OreDunGen
      replacement: AsteroidRock
      entity: AsteroidRockSalt
      count: 5
      minGroupSize: 8
      maxGroupSize: 10
    - !type:OreDunGen
      replacement: AsteroidRock
      entity: AsteroidRockGold
      count: 9
      minGroupSize: 4
      maxGroupSize: 8
    - !type:OreDunGen
      replacement: AsteroidRock
      entity: AsteroidRockSilver
      count: 9
      minGroupSize: 4
      maxGroupSize: 8
    - !type:OreDunGen
      replacement: AsteroidRock
      entity: AsteroidRockPlasma
      count: 7
      minGroupSize: 3
      maxGroupSize: 6
    - !type:OreDunGen
      replacement: AsteroidRock
      entity: AsteroidRockUranium
      count: 7
      minGroupSize: 3
      maxGroupSize: 6
    - !type:OreDunGen
      replacement: AsteroidRock
      entity: AsteroidRockArtifactFragment
      count: 6
      minGroupSize: 1
      maxGroupSize: 3
    - !type:OreDunGen
      replacement: AsteroidRock
      entity: AsteroidRockDiamond
      count: 6
      minGroupSize: 1
      maxGroupSize: 2
    - !type:OreDunGen
      replacement: AsteroidRock
      entity: AsteroidRockGibtonite
      count: 15 # you don't really hit it on purpose so it should be common
      minGroupSize: 1
      maxGroupSize: 1
    # Crabs
    - !type:OreDunGen
      replacement: AsteroidRockTin
      entity: AsteroidRockTinCrab
      count: 8
      minGroupSize: 1
      maxGroupSize: 1
    - !type:OreDunGen
      replacement: AsteroidRockCoal
      entity: AsteroidRockCoalCrab
      count: 8
      minGroupSize: 1
      maxGroupSize: 1
    - !type:OreDunGen
      replacement: AsteroidRockQuartz
      entity: AsteroidRockQuartzCrab
      count: 8

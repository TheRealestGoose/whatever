- type: dungeonConfig
  id: VGRoidBelt
  # minOffset: 40
  # maxOffset: 60
  layers:
  - !type:NoiseDistanceDunGen
    size: 250, 250
    distanceConfig: !type:DunGenEuclideanSquaredDistance
    layers:
    - tile: FloorAsteroidSand
      threshold: 0.45
      noise:
        frequency: 0.080
        noiseType: OpenSimplex2
        fractalType: FBm
        octaves: 5
        lacunarity: 1.5
        gain: 0.5

- type: dungeonConfig
  id: VGRoidExteriorSmall
  reserveTiles: true
  layers:
  - !type:PrototypeDunGen
    proto: VGRoidExteriorDungeonsSmall
  - !type:SplineDungeonConnectorDunGen
    tile: PlatingAsteroid
    widenTile: FloorAsteroidSand

- type: dungeonConfig
  id: VGRoidExteriorDungeonsSmall
  reserveTiles: true
  minCount: 1
  maxCount: 1
  layers:
  - !type:ExteriorDunGen
    proto: Experiment
  - !type:EntityTableDunGen
    minCount: 20
    maxCount: 30
    table: !type:NestedSelector
      tableId: SalvageScrapSpawnerCommon
  - !type:EntityTableDunGen
    minCount: 20
    maxCount: 30
    table: !type:NestedSelector
      tableId: SalvageScrapSpawnerValuable
  - !type:EntityTableDunGen
    minCount: 20
    maxCount: 35
    table: !type:NestedSelector
      tableId: SalvageTreasureSpawnerCommon
  - !type:EntityTableDunGen
    minCount: 25
    maxCount: 35
    table: !type:NestedSelector
      tableId: SalvageTreasureSpawnerValuable
  - !type:MobsDunGen
    minCount: 6
    maxCount: 10
    contents: VGRoidExteriorDungeonsMobs


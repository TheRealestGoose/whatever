- type: dungeonConfig
  id: VGRoidBlobSmallShadow
  layers:
  - !type:NoiseDistanceDunGen
    size: 100, 100 #169, 169
    distanceConfig: !type:DunGenEuclideanSquaredDistance
      blendWeight: 0.80
    layers:
    - tile: FloorChromite
      threshold: 0.50
      noise:
        frequency: 0.010
        noiseType: OpenSimplex2
        fractalType: FBm
        octaves: 5
        lacunarity: 2
        gain: 0.5

- type: dungeonConfig
  id: VGRoidBlobSmallShadowPit
  layers:
  - !type:NoiseDistanceDunGen
    size: 70, 70 #169, 169
    distanceConfig: !type:DunGenEuclideanSquaredDistance
      blendWeight: 0.80
    layers:
    - tile: Space
      threshold: 0.50
      noise:
        frequency: 0.010
        noiseType: OpenSimplex2
        fractalType: FBm
        octaves: 5
        lacunarity: 2
        gain: 0.5

- type: dungeonConfig
  id: VGRoidBlobSmallShadowIslandSmall
  layers:
  - !type:NoiseDistanceDunGen
    size: 40, 40 #169, 169
    distanceConfig: !type:DunGenEuclideanSquaredDistance
      blendWeight: 0.80
    layers:
    - tile: FloorChromite
      threshold: 0.50
      noise:
        frequency: 0.010
        noiseType: OpenSimplex2
        fractalType: FBm
        octaves: 5
        lacunarity: 2
        gain: 0.5

- type: dungeonConfig
  id: VGRoidShadowReverseCaveSystem
  # minOffset: 40
  # maxOffset: 60
  layers:
  - !type:NoiseDistanceDunGen
    size: 135, 135
    distanceConfig: !type:DunGenEuclideanSquaredDistance
    layers:
    - tile: FloorChromite
      threshold: 0.6
      invert: true
      noise:
        seed: 0
        noiseType: Perlin
        fractalType: Ridged
        octaves: 1
        frequency: 0.1
        gain: 0.5
  - !type:MobsDunGen
    minCount: 15
    maxCount: 20
    contents: SalvageSpawnerMobShadowMobs

- type: dungeonConfig
  id: VGRoidShadowReverseCaveSystemSmall
  # minOffset: 40
  # maxOffset: 60
  layers:
  - !type:NoiseDistanceDunGen
    size: 80, 80
    distanceConfig: !type:DunGenEuclideanSquaredDistance
    layers:
    - tile: FloorChromite
      threshold: 0.7
      invert: true
      noise:
        seed: 0
        noiseType: Perlin
        fractalType: Ridged
        octaves: 1
        frequency: 0.1
        gain: 0.5


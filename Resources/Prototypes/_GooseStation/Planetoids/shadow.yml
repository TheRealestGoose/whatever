- type: entity
  name: nightwing watcher bolt
  id: WatcherBoltNightwing
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  # - type: Aura
  #   auraFarm: 1
  #   auraColor: "#FFFFFFFF"
  #   distortion: 0.01
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles_tg.rsi
    layers:
    - state: omnilaser_greyscale
      shader: unshaded
      color: "#793a80dd"
  - type: Ammo
    muzzleFlash: null
  - type: Projectile
    #   soundHit:  Waiting on serv3
    impactEffect: BulletImpactEffectDisabler
    damage:
      types:
        Cold: 5
  - type: TimedDespawn
    lifetime: 2
  - type: ChangeTemperatureOnCollide
    heat: -10000 # Lavaland Change
  - type: FlyBySound
    sound:
      collection: EnergyMiss
      params:
        volume: -100
  - type: StaminaDamageOnCollide
    damage: 40

- type: entity
  name: nightwing watcher bolt
  id: WatcherBoltNightwingSpread
  parent: WatcherBoltNightwing
  categories: [ HideSpawnMenu ]
  components:
  - type: ProjectileSpread
    proto: WatcherBoltNightwing
    count: 3
    spread: 15


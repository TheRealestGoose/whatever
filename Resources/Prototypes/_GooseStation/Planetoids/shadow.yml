- type: entity
  parent: MarkerBase
  id: SalvageSpawnerMobShadow
  name: Shadow Mob Spawner
  components:
  - type: Sprite
    layers:
    - state: green
    - sprite: Mobs/Aliens/Lavaland/watcher.rsi
      map: [ "enum.DamageStateVisualLayers.Base" ]
      state: base
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      sprite: Mobs/Aliens/Lavaland/watcher.rsi
      state: unshaded
      shader: unshaded
      color: "#793a80dd"
  - type: EntityTableSpawner
    table: !type:GroupSelector
      children:
      - id: MobWatcherShadowNightwing
        weight: 45
      - id: MobWatcherShadowNightwing
        weight: 35
      - id: MobWatcherShadowNightwing
        weight: 20

- type: entity
  id: MobWatcherShadowNightwing
  name: nightwing watcher
  description: Huge fan of bullethell shooters.
  parent: [ SimpleSpaceMobBase, FlyingMobBase ]
  components:
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Effects/bite.ogg
    damage:
      types:
        Slash: 10
        Structural: 20
  #watcher
  - type: DamageStateVisuals
    states:
      Alive:
        Base: base
        BaseUnshaded: unshaded
      Dead:
        Base: dead
        BaseUnshaded: dead-unshaded
  - type: NpcFactionMember
    factions:
    - Lavafauna
  - type: HTN
    rootTask:
      task: SimpleRangedHostileCompound
    blackboard:
      NavSmash: !type:Bool
        true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.30
        density: 80
        mask:
          - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: MovementSpeedModifier
    baseSprintSpeed: 3.5
    baseWalkSpeed: 2.5
  - type: MovementIgnoreGravity
  - type: BasicEntityAmmoProvider
    proto: WatcherBoltNightwingSpread
  - type: Gun
    projectileSpeed: 5
    fireRate: 0.4
    useKey: false
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot: /Audio/Weapons/Guns/Gunshots/taser2.ogg
  - type: CombatMode
  - type: Fauna # Lavaland Change
  #watcher
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Aliens/Lavaland/watcher.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: base
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: unshaded
      shader: unshaded
      color: "#793a80dd"
  - type: PointLight
    radius: 1.5
    energy: 0.5
    color: "#793a80dd"
  - type: Butcherable
    spawned:
    - id: PlasmaOre1
      amount: 1
      maxAmount: 5
    - id: DiamondOre1
      amount: 1
      maxAmount: 1

- type: dungeonConfig
  id: VGRoidShadowChasms
  layers:
    - !type:PrototypeDunGen
      proto: VGRoidBlobSmallShadow
    - !type:PrototypeDunGen
      proto: VGRoidShadowReverseCaveSystem
    - !type:PrototypeDunGen
      proto: VGRoidBlobSmallShadowPit # maybe an island in the middle with stuff? maybe thin cave PATHS into the middle? hard choice.
    - !type:PrototypeDunGen
      proto: VGRoidBlobSmallShadowIslandSmall
    - !type:PrototypeDunGen
      proto: VGRoidShadowReverseCaveSystemSmall
    # Fill
    - !type:PrototypeDunGen
      proto: VGRoidFillWallRockChromite
      inheritDungeons: All
    # - !type:PrototypeDunGen
    #   proto: VGRoidFillShadowPit
    #   inheritDungeons: All
    # Ores
    - !type:OreDunGen
      replacement: WallRockChromite
      entity: WallRockChromiteQuartz
      count: 4
      minGroupSize: 1
      maxGroupSize: 2
    - !type:OreDunGen
      replacement: WallRockChromite
      entity: WallRockChromiteGold
      count: 5
      minGroupSize: 1
      maxGroupSize: 2
    - !type:OreDunGen
      replacement: WallRockChromite
      entity: WallRockChromiteSilver
      count: 5
      minGroupSize: 1
      maxGroupSize: 2
    - !type:OreDunGen
      replacement: WallRockChromite
      entity: WallRockChromitePlasma
      count: 4
      minGroupSize: 1
      maxGroupSize: 2
    - !type:OreDunGen
      replacement: WallRockChromite
      entity: WallRockChromiteUranium
      count: 1
      minGroupSize: 1
      maxGroupSize: 2
    - !type:OreDunGen
      replacement: WallRockChromite
      entity: WallRockChromiteArtifactFragment
      count: 5
      minGroupSize: 1
      maxGroupSize: 2
    - !type:OreDunGen
      replacement: WallRockChromite
      entity: WallRockChromiteDiamond
      count: 3
      minGroupSize: 1
      maxGroupSize: 1
    # Bug out so no split if want
    # - !type:PrototypeDunGen

- type: entityTable
  id: SalvageSpawnerMobShadowMobs
  table: !type:GroupSelector
    children:
    - id: SalvageSpawnerMobShadow
      amount: 1


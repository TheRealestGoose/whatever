- type: entity
  id: WindowBlindsBase
  name: window blinds
  abstract: true
  description: They can completely block the view when needed.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    drawdepth: Overdoors
    noRot: false
    sprite: _GooseStation/Blinds/solo.rsi
    layers:
      - state: open
        map: ["enum.DoorVisualLayers.Base"]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 100
        mask:
        - FullTileMask
        layer:
        - Opaque
  - type: UseDelay
    delay: 0.35
  - type: Transform
    anchored: true
  - type: Clickable
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: InteractionOutline
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 0
            max: 1
  - type: WallMount
    arc: 180
  - type: Occluder
    enabled: false
  - type: Appearance
  # - type: InteractionRange
  #   range: 2.25
  - type: Door
    canCrush: false
    performCollisionCheck: false
    bumpOpen: false
    clickOpen: true
    closeTimeOne: 0 #0.5
    closeTimeTwo: 0 #0.1
    openTimeOne: 0 #0.5
    openTimeTwo: 0 #0.1
    state: Open
    openSound:
      path: /Audio/Effects/curtain_openclose.ogg
    closeSound:
      path: /Audio/Effects/curtain_openclose.ogg
  - type: Construction
    graph: WindowBlinds

- type: entity
  id: WindowBlindsSolo
  parent: WindowBlindsBase
  name: window blinds (solo)
  components:
  - type: Construction
    node: WindowBlindsSolo

- type: entity
  id: WindowBlindsLeft
  parent: WindowBlindsBase
  name: window blinds (left)
  components:
  - type: Construction
    node: WindowBlindsLeft
  - type: Sprite
    sprite: _GooseStation/Blinds/left.rsi

- type: entity
  id: WindowBlindsMiddle
  parent: WindowBlindsBase
  name: window blinds (middle)
  components:
  - type: Construction
    node: WindowBlindsMiddle
  - type: Sprite
    sprite: _GooseStation/Blinds/middle.rsi

- type: entity
  id: WindowBlindsRight
  parent: WindowBlindsBase
  name: window blinds (right)
  components:
  - type: Construction
    node: WindowBlindsRight
  - type: Sprite
    sprite: _GooseStation/Blinds/right.rsi



#region Construction
- type: construction
  id: WindowBlindsSolo
  graph: WindowBlinds
  startNode: start
  targetNode: WindowBlindsSolo
  category: construction-category-structures
  objectType: Structure
  placementMode: SnapgridCenter
  canBuildInImpassable: true

- type: construction
  id: WindowBlindsLeft
  graph: WindowBlinds
  startNode: start
  targetNode: WindowBlindsLeft
  category: construction-category-structures
  objectType: Structure
  placementMode: SnapgridCenter
  canBuildInImpassable: true

- type: construction

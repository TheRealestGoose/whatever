#region Graph
- type: constructionGraph
  id: WindowBlinds
  start: start
  graph:
    - node: start
      actions:
        - !type:DeleteEntity {}
      edges:
        - to: WindowBlindsSolo
          completed:
            - !type:SnapToGrid { }
          steps:
            - material: Steel #<V maybe plastic?
              amount: 2
              doAfter: 2
        - to: WindowBlindsLeft
          completed:
            - !type:SnapToGrid { }
          steps:
            - material: Steel
              amount: 2
              doAfter: 2
        - to: WindowBlindsRight
          completed:
            - !type:SnapToGrid { }
          steps:
            - material: Steel
              amount: 2
              doAfter: 2
        - to: WindowBlindsMiddle
          completed:
            - !type:SnapToGrid { }
          steps:
            - material: Steel
              amount: 2
              doAfter: 2

    - node: WindowBlindsSolo
      entity: WindowBlindsSolo
      edges:
        - to: start
          completed:
          - !type:SpawnPrototype
                prototype: SheetSteel1
                amount: 2
          steps:
            - tool: Anchoring
              doAfter: 1
    - node: WindowBlindsLeft
      entity: WindowBlindsLeft
      edges:
        - to: start
          completed:
          - !type:SpawnPrototype
                prototype: SheetSteel1
                amount: 2
          steps:
            - tool: Anchoring
              doAfter: 1
    - node: WindowBlindsMiddle
      entity: WindowBlindsMiddle
      edges:
        - to: start
          completed:
          - !type:SpawnPrototype
                prototype: SheetSteel1
                amount: 2
          steps:
            - tool: Anchoring
              doAfter: 1
    - node: WindowBlindsRight
      entity: WindowBlindsRight
      edges:
        - to: start
          completed:
          - !type:SpawnPrototype
                prototype: SheetSteel1
                amount: 2
          steps:
            - tool: Anchoring
              doAfter: 1

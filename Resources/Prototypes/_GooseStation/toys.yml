#region bad to the bone
- type: entity
  parent: BikeHorn
  id: BikeHornBadToTheBone
  name: bad to the bike horn
  description: A bike horn that plays a sick guitar riff.
  components:
  - type: Sprite
    sprite: Objects/Fun/bikehorn.rsi
    state: icon
  - type: Item
    sprite: Objects/Fun/bikehorn.rsi
    size: Tiny
  - type: Clothing
    sprite: Objects/Fun/bikehorn.rsi
    slots: [Belt]
    quickEquip: false
  - type: UseDelay
    delay: 1.5 #!!!
  - type: EmitSoundOnUse
    sound:
      path: /Audio/_Goobstation/Voice/badtothebone.ogg
      params:
        variation: 0.1
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Goobstation/Voice/badtothebone.ogg
      params:
        variation: 0.1
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/_Goobstation/Voice/badtothebone.ogg
      params:
        variation: 0.1
  - type: EmitSoundOnActivate
    sound:
      path: /Audio/_Goobstation/Voice/badtothebone.ogg
      params:
        variation: 0.1
  - type: EmitSoundOnCollide
    sound:
      path: /Audio/_Goobstation/Voice/badtothebone.ogg
      params:
        variation: 0.1
  - type: Tag
    tags:
    - Payload # yes, you can make re-usable prank grenades
    # - BikeHorn #so sorry
    - VehicleKey #Goobstatiuon - Clowncar
  - type: MeleeWeapon
    animationRotation: 135 # WWDP
    wideAnimationRotation: 135
    soundHit:
      path: /Audio/_Goobstation/Voice/badtothebone.ogg
      params:
        variation: 0.125
    damage:
      types:
        Blunt: 0
  - type: Tool
    qualities:
    - Honking
    useSound:
      path: /Audio/_Goobstation/Voice/badtothebone.ogg
  - type: Construction
    graph: BikeHornBadToTheBone
    node: BikeHornBadToTheBone

- type: constructionGraph
  id: BikeHornBadToTheBone
  start: start
  graph:
    - node: start
      edges:
        - to: BikeHornBadToTheBone
          completed:
            - !type:SnapToGrid
          steps:
            - tag: BikeHorn
              amount: 1
              name: "a worthy sacrifice"
              icon:
                sprite: Objects/Fun/bikehorn.rsi
                state: icon
            - material: Bones
              amount: 1
              doAfter: 5
    - node: BikeHornBadToTheBone
      entity: BikeHornBadToTheBone

- type: construction
  id: BikeHornBadToTheBone
  graph: BikeHornBadToTheBone
  startNode: start
  targetNode: BikeHornBadToTheBone
  name: bad to the bike horn
  description: A bike horn that plays a sick guitar riff.
  category: construction-category-misc
  objectType: Item


#region everything else
- type: entity
  parent: BasePlushie
  id: PlushieSpaniard
  name: spaniard plushie
  description: This is a plush of a spaniard. All craftsmanship is of the lowest quality. Embroidered upon it's vest are the words "I have no mouth and I must scream".
  components:
  - type: Sprite
    sprite: _GooseStation/plushies/32x.rsi
    state: spaniard
  - type: EmitSoundOnUse
    sound:
      collection: ToySqueak
  - type: EmitSoundOnLand
    sound:
      collection: ToySqueak
  - type: EmitSoundOnActivate
    sound:
      collection: ToySqueak
  - type: EmitSoundOnCollide
    sound:
      collection: MaleScreams
  - type: Food
    requiresSpecialDigestion: true
    sound:
      collection: MaleScreams #only screams if hurt
  - type: MeleeWeapon
    soundHit:
      collection: MaleScreams 
  - type: EmitSoundOnTrigger
    sound:
      collection: ToySqueak
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 25
        reagents:
        - ReagentId: Blood
          Quantity: 25
  - type: Damageable
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/poster_broken.ogg
      - !type:PlaySoundBehavior
        sound:
          collection: MaleScreams
      - !type:SpawnEntitiesBehavior
        offset: 0
        spawn:
          PlushieSpaniardTorn:
            min: 1
            max: 1
      - !type:SpawnEntitiesBehavior
        offset: 0.2
        spawn:
          MaterialCotton1:
            min: 1
            max: 2
      - !type:SpawnEntitiesBehavior
        offset: 0.2
        spawn:
          MaterialCotton1:
            min: 1
            max: 2
      - !type:SpawnEntitiesBehavior
        offset: 0.2
        spawn:
          MaterialCotton1:
            min: 1
            max: 2
      - !type:SpillBehavior
        solution: food
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: BaseItem
  id: PlushieSpaniardTorn
  name: torn spaniard plushie #no stash cuz torn
  description: This is a torn plush of a spaniard. All craftsmanship is of the lowest quality, but despite that, the plushie looks hurt. Embroidered upon it's vest are the words "I have no mouth and I must scream".
  components:
  - type: Sprite
    sprite: _GooseStation/plushies/32x.rsi
    state: spaniard-torn
  - type: EmitSoundOnUse
    sound:
      collection: MaleScreams #everything hurts now
  - type: EmitSoundOnLand
    sound:
      collection: MaleScreams
  - type: EmitSoundOnActivate
    sound:
      collection: MaleScreams
  - type: EmitSoundOnCollide
    sound:
      collection: MaleScreams
  - type: Edible
    requiresSpecialDigestion: true
    delay: 2
    sound:
      collection: MaleScreams
  - type: MeleeWeapon
    wideAnimationRotation: 180
    soundHit:
      collection: MaleScreams
    damage:
      types:
        Blunt: 0
    hidden: true
  - type: EmitSoundOnTrigger
    sound:
      collection: MaleScreams
  - type: UseDelay
    delay: 1.0
  - type: PhysicalComposition
    materialComposition:
      Cloth: 100
  - type: StaticPrice
    price: 1 #cuz torn
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Fiber
          Quantity: 10
  - type: Tag
    tags:
    - Payload
    - ClothMade

- type: entity
  parent: BasePlushie
  id: PlushieGoose
  name: goose plushie
  description: This is a horrifying plush of a goose. You can feel it staring into your soul.
  components:
  - type: Flight
    isLayerAnimated: false
    layer: "/Textures/_GooseStation/plushies/32x.rsi"
    on: true
    animationKey: "Flap"
    staminaDrainRate: 0
    flapSound:
      path: /Audio/Animals/goose_honk.ogg
      params:
        volume: -100
  - type: Sprite
    sprite: _GooseStation/plushies/32x.rsi
    layers:
      - state: goose
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 25
        reagents:
        - ReagentId: DemonsBlood
          Quantity: 5
        - ReagentId: Lead #so moth die; this is actually 666 ticks of damage adding up to 400
          Quantity: 20
  - type: EmitSoundOnUse
    sound:
      path: /Audio/Animals/goose_honk.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Animals/goose_honk.ogg
  - type: EmitSoundOnActivate
    sound:
      path: /Audio/Animals/goose_honk.ogg
  - type: EmitSoundOnCollide
    sound:
      path: /Audio/Animals/goose_honk.ogg
  - type: Food
    requiresSpecialDigestion: true
    useSound:
      path: /Audio/Animals/goose_honk.ogg
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Animals/goose_honk.ogg
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/Animals/goose_honk.ogg


- type: entity
  id: SpaniardPinataSpawn
  suffix: spawn
  name: spaniard pinata
  description: It just fell from the ceiling!
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _GooseStation/plushies/32x64.rsi
    snapCardinals: true
    layers:
    - state: spaniard-pinata-spawn
      map: [ "enum.DamageStateVisualLayers.Base" ]
    offset: "0, 0.5"
    drawdepth: Overdoors
  - type: TimedDespawn #i've cut off the shaking part here, it's unnecessary
    lifetime: 1 #2.65
  - type: SpawnOnDespawn
    prototype: SpaniardPinata
  # - type: SpamEmitSound #play sound as it falls
  #   minInterval: 0.3
  #   maxInterval: 0.3
  #   sound:
  #     path: /Audio/Effects/soft_thump.ogg

- type: entity
  parent: BaseStructure
  id: SpaniardPinata
  name: spaniard pinata
  description: In a cruel twist of events, the spaniard himself is dangling on a line, lest we forget the candy spilled in the Great Piñata war.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _GooseStation/plushies/32x64.rsi
    snapCardinals: true
    layers:
    - state: spaniard-pinata
      map: [ "enum.DamageStateVisualLayers.Base" ]
    offset: "0, 0.5"
    drawdepth: Overdoors
  - type: SpriteFade
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
    # canCollide: False
  - type: Anchorable
  - type: Pullable
  - type: InteractionOutline
  - type: Damageable
    damageContainer: Box
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/poster_broken.ogg
      - !type:PlaySoundBehavior
        sound:
          collection: MaleScreams
      - !type:SpawnEntitiesBehavior
        offset: 0
        spawn:
          PlushieSpaniardTorn:
            min: 1
            max: 1
      - !type:SpawnEntitiesBehavior
        offset: 0.2
        spawn:
          MaterialCotton1:
            min: 1
            max: 2
      - !type:SpawnEntitiesBehavior
        offset: 0.2
        spawn:
          MaterialCotton1:
            min: 1
            max: 2
      - !type:SpawnEntitiesBehavior
        offset: 0.2
        spawn:
          MaterialCotton1:
            min: 1
            max: 2
      - !type:SpawnEntitiesBehavior
        offset: 0.5
        spawn:
          FoodSnackCandyWrappedSpawner:
            min: 6
            max: 10
          FoodSnackCandyWrappedRainbow:
            min: -1
            max: 2
          FoodSnackCandyWrapped:
            min: 0
            max: 5
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Fixtures #make it dangle if someone goes under?
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.29,-0.1,0.275,0.75"
        density: 60
        mask:
        - MobMask
        layer:
        - MobLayer


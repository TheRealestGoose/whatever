- type: entity
  id: JukeboxRadio
  name: radio
  parent: BaseItem
  description: An oldschool radio. Music quality leaves much to be desired.
  components:
  - type: Animateable
  - type: InteractionOutline
  - type: Sprite
    sprite: _GooseStation/jukebox.rsi
    layers:
    - state: "on"
      map: ["enum.JukeboxVisualLayers.Base"]
  - type: Transform
  - type: Jukebox
    onState: on
    offState: off
    selectState: select
  - type: Appearance
  - type: ActivatableUI
    key: enum.JukeboxUiKey.Key
  - type: UserInterface
    interfaces:
        enum.JukeboxUiKey.Key:
          type: JukeboxBoundUserInterface
        enum.WiresUiKey.Key:
          type: WiresBoundUserInterface
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 2

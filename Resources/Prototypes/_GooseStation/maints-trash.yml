- type: constructionGraph
  id: BrokenBorg
  start: start
  graph:
    - node: start
      actions:
        - !type:SpawnPrototype
          prototype: SheetSteel1
          amount: 4
        - !type:DeleteEntity

    - node: robot
      edges:
        - to: start
          steps:
            - tool: Welding #remove as much rust as possible first
              doAfter: 5
            - tool: Prying #pry off the outer shell
              doAfter: 3
              completed:
                - !type:SpawnPrototype
                  prototype: SheetSteel1
                  amount: 2
            - tool: Cutting #cut away at cables
              doAfter: 2
              completed:
                - !type:SpawnPrototype
                  prototype: CableApcStack1
                  amount: 4
            - tool: Anchoring #loosen the endoskeleton
              doAfter: 2
            - tool: Screwing  # ^^^^^^^
              doAfter: 2
            - tool: Prying    # ^^^^^^^
              doAfter: 2
            - tool: Welding #harvest the insides
              doAfter: 5
              completed:
                - !type:SpawnPrototype
                  prototype: SheetSteel1
                  amount: 4
          completed:
            - !type:SpawnPrototype
              prototype: SheetSteel1
              amount: 2

#region Vending machines

- type: entity
  parent: BaseStructure
  id: VendingMachineBrokenBase
  name: broken vending machine
  description: A brutalised vending machine, damaged beyond repair. Behind what remains of the glass is a couple of unlooted items.
  abstract: true
  components:
  - type: InteractionOutline
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Sprite
    noRot: true
    sprite: Structures/Machines/VendingMachines/empty.rsi
    snapCardinals: false
  - type: Physics
    bodyType: Static
  - type: Transform
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.45,0.25,0.45"
        mask:
        - MachineMask
        layer:
        - MachineLayer
        density: 200
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Appearance

- type: entity
  parent: VendingMachineBrokenBase
  id: VendingMachineVendomatBroken
  name: broken Vendomat
  description: A brutalised Vendomat, damaged beyond repair. Behind what remains of the glass is a couple of unlooted items.
  components:
  - type: Sprite
    sprite: Structures/Machines/VendingMachines/vendomat.rsi
    snapCardinals: false
    state: broken
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 4
          MicroManipulatorStockPart:
            min: 2
            max: 5
          CableApcStack1:
            min: 15
            max: 30
          PowerCellSmallPrinted:
            min: 0
            max: 1
          Wirecutter:
            min: 0
            max: 1
          Screwdriver:
            min: 0
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Appearance

- type: entity
  parent: VendingMachineBrokenBase
  id: VendingMachineCigsBroken
  name: broken ShadyCigs Deluxe
  description: A brutalised ShadyCigs Deluxe, damaged beyond repair. Behind what remains of the glass is a couple of unlooted items.
  components:
  - type: Sprite
    sprite: Structures/Machines/VendingMachines/cigs.rsi
    snapCardinals: false
    state: broken
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 4
          CheapLighter:
            min: 0
            max: 2
          PackPaperRollingFilters:
            min: 0
            max: 1
          Matchbox:
            min: 1
            max: 1
          CigPackGreen:
            min: -1 #smaller chance, because there's 3 more packs aside from this one
            max: 1
          CigPackBlue:
            min: -1
            max: 1
          CigPackRed:
            min: -1
            max: 1
          CigPackBlack:
            min: -1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Appearance




  description: A monument to the fact that "out of sight, out of mind" is a lie we tell ourselves.
  abstract: true
  components:
  - type: RatKingRummageable
    table: !type:NestedSelector
      tableId: RatKingLoot
  - type: InteractionOutline
  - type: Sprite
    noRot: true
    sprite: _GooseStation/bag-pile.rsi
    layers:
    - state: bags-1
      map: [ "enum.DamageStateVisualLayers.Base" ]
    - state: flies-1
      map: [ "flies" ]
  # - type: AmbientSound
  #   volume: 10 #-2

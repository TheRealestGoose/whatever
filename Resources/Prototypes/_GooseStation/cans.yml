#region Plastic cans
- type: entity
  name: plastic canister
  parent: BaseItem
  id: PlasticCanEmpty
  suffix: Empty
  description: The structural integrity of a soda bottle with the responsibilities of a fuel tank.
  components:
  - type: Sprite
    sprite: _GooseStation/plastic_can.rsi
    layers:
      - state: icon
      - state: solution-1
        map: ["enum.SolutionContainerLayers.Fill"]
        visible: false
  - type: MeleeWeapon
    soundNoDamage:
      path: "/Audio/Effects/Fluids/splat.ogg"
    attackRate: 0.9
    damage:
      types:
        Blunt: 0
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 5
    fillBaseName: solution-
  - type: Item
    size: Normal
    sprite: _GooseStation/plastic_can.rsi
  - type: Openable
    sound:
      collection: bottleOpenSounds
    closeable: true
    closeSound:
      collection: bottleCloseSounds
  - type: Spillable
    solution: spray
  - type: RefillableSolution
    solution: spray
  - type: DrainableSolution
    solution: spray
  - type: ExaminableSolution
    solution: spray
  - type: DrawableSolution
    solution: spray
  - type: SolutionTransfer
    maxTransferAmount: 30
    canChangeTransferAmount: true
  - type: SolutionContainerManager
    solutions:
      spray:
        maxVol: 300
  - type: UserInterface
    interfaces:
      enum.TransferAmountUiKey.Key:
        type: TransferAmountBoundUserInterface
  - type: PhysicalComposition
    materialComposition:
      Plastic: 100
  - type: StaticPrice
    price: 50

